name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: dots-up/go.mod
          cache-dependency-path: dots-up/go.sum

      - name: Build release assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          packaging/build-release "${TAG#v}" dist
          # The formula for EzraCerpac/homebrew-tap, with this release's checksums;
          # it is copied to the tap by hand.
          { printf '```ruby\n'; cat dist/dots.rb; printf '```\n'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/dots-*.tar.gz dist/SHA256SUMS dist/dots.rb --verify-tag --title "$TAG" --generate-notes
