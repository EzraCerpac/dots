[test-groups]
pty = { max-threads = 1 }

[profile.ci]
retries = 2
fail-fast = false
slow-timeout = { period = "30s" }
status-level = "slow"
final-status-level = "flaky"

[profile.ci.junit]
path = "junit.xml"

# Libtest serializes this suite with an in-process mutex. Nextest isolates each
# test in a separate process, so enforce the same per-run limit in the scheduler.
[[profile.ci.overrides]]
filter = "binary(direct_job_control)"
test-group = "pty"
