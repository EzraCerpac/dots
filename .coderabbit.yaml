# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Review settings for this repository. Linters CodeRabbit runs by default
# (shellcheck, actionlint, gitleaks, golangci-lint, markdownlint) stay on.
language: en-US
reviews:
  profile: chill
  auto_review:
    enabled: true
    drafts: false
knowledge_base:
  code_guidelines:
    # Project promises and what not to raise; AGENTS.md is read by default.
    filePatterns:
      - "REVIEW.md"
