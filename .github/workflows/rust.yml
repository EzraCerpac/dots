name: Rust

on:
  pull_request:
  push:
    branches: [rust, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_VERSION: "1.100.0"

jobs:
  rust:
    name: Rust (${{ matrix.host[matrix.platform].target }})
    runs-on: ${{ matrix.host[matrix.platform].runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Module PRs run Linux. Integrated pushes and main-bound PRs also run both Macs.
        platform: ${{ fromJSON(github.base_ref == 'rust' && '["linux"]' || '["linux","macos"]') }}
        host:
          - linux: { runner: ubuntu-24.04, arch: x86_64, target: x86_64-unknown-linux-musl }
            macos: { runner: macos-15-intel, arch: x86_64, target: x86_64-apple-darwin }
          - linux: { runner: ubuntu-24.04-arm, arch: aarch64, target: aarch64-unknown-linux-musl }
            macos: { runner: macos-15, arch: arm64, target: aarch64-apple-darwin }
    env:
      ARCH: ${{ matrix.host[matrix.platform].arch }}
      CARGO_BUILD_TARGET: ${{ matrix.host[matrix.platform].target }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends musl-tools bash zsh fish age
          printf 'CC=musl-gcc\nCARGO_TARGET_%s_LINKER=musl-gcc\n' \
            "$(printf '%s' "$CARGO_BUILD_TARGET" | tr '[:lower:]-' '[:upper:]_')" >> "$GITHUB_ENV"

      - name: Install Fish on macOS
        if: runner.os == 'macOS'
        run: brew install fish

      - name: Verify shell executables
        run: |
          bash --version
          zsh --version
          fish --version

      - name: Install the pinned Rust toolchain and target
        run: |
          test "$(uname -m)" = "$ARCH"
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy --target "$CARGO_BUILD_TARGET"

      - name: Install standalone mise
        shell: bash
        env:
          MISE_VERSION: v2026.11.9
        run: |
          curl -fsSL https://mise.run | sh
          "$HOME/.local/bin/mise" --version
          test "$("$HOME/.local/bin/mise" --version | cut -d ' ' -f 1)" = "${MISE_VERSION#v}"
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install age on macOS
        if: runner.os == 'macOS'
        run: |
          mise install age@1.3.2
          age_bin="$(mise which age --tool age@1.3.2)"
          # Keep the fixture tools on PATH when mise activates the project's Rust toolchain.
          fixture_bin="$RUNNER_TEMP/dots-fixture-bin"
          mkdir -p "$fixture_bin"
          for tool in age age-keygen; do
            install -m 0755 "${age_bin%/*}/$tool" "$fixture_bin/$tool"
          done
          printf '%s\n' "$fixture_bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: rustup run "$RUST_VERSION" cargo fmt --all -- --check

      - name: Lint
        run: mise run clippy

      - name: Run all tests natively
        run: |
          age --version
          age-keygen --version
          mise run test

  legacy-oracle:
    name: v0.4.0 oracle (${{ matrix.os }})
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/rust') ||
      (github.event_name == 'pull_request' &&
       (github.base_ref == 'rust' || (github.base_ref == 'main' && github.head_ref == 'rust')))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.base_ref == 'rust' && '["ubuntu-24.04"]' || '["ubuntu-24.04","macos-15"]') }}
    env:
      MISE_VERSION: v2026.11.9
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fish jq rsync zsh

      - name: Install Fish on macOS
        if: runner.os == 'macOS'
        run: brew install fish

      - name: Install the pinned Rust toolchain and oracle tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_YES: "1"
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          curl -fsSL https://mise.run | sh
          mise_bin="$HOME/.local/bin/mise"
          test "$("$mise_bin" --version | cut -d ' ' -f 1)" = "${MISE_VERSION#v}"
          printf '%s\n' "${mise_bin%/*}" >> "$GITHUB_PATH"
          cd "$RUNNER_TEMP"
          "$mise_bin" use --global node@latest python@3.13 uv@latest jj@latest age@latest gitleaks@latest
          # World replaces HOME and XDG paths. Give it installed binaries instead of shims.
          "$mise_bin" bin-paths >> "$GITHUB_PATH"

      - name: Verify and unpack the pinned oracle
        env:
          PLATFORM: ${{ matrix.os == 'macos-15' && 'darwin-arm64' || 'linux-amd64' }}
        run: |
          repo=https://github.com/EzraCerpac/dots
          tag=v0.4.0
          commit=f5c8a0e83b333dbea6c0b5f19725cc818ffca674
          test "$(git ls-remote "$repo.git" "refs/tags/$tag" | cut -f1)" = "$commit"
          archive="dots-${tag#v}-$PLATFORM"
          oracle="$(mktemp -d "$RUNNER_TEMP/dots-oracle.XXXXXX")"
          cd "$oracle"
          for asset in SHA256SUMS "$archive.tar.gz"; do
            curl -fsSL --retry 3 "$repo/releases/download/$tag/$asset" -o "$asset"
          done
          # Pin the published manifest so replaced assets can't change the oracle.
          printf '%s  SHA256SUMS\n' dc1319f9a2087383ef4fb443b96cd117b3d7c2d18a2fc784dc4e1a3fe864f6c3 | shasum -a 256 -c
          awk -v asset="$archive.tar.gz" '$2 == asset' SHA256SUMS | shasum -a 256 -c
          tar -xzf "$archive.tar.gz"
          test "$(cat "$archive/VERSION")" = "${tag#v}"
          test -x "$archive/bin/dots"
          test -x "$archive/bin/dots-up"
          printf 'DOTS_BIN=%s/%s/bin/dots\n' "$(pwd -P)" "$archive" >> "$GITHUB_ENV"

      - name: Run unchanged black-box scenarios against the archive
        run: |
          for tool in mise git bash zsh fish node python3 uv jj age age-keygen gitleaks jq gh rsync less; do
            command -v "$tool"
          done
          # Discover every integration suite. Libtest's default filter matches substrings.
          listing="$(mise run test -- --test '*' -- --list --format terse)"
          scenarios=()
          while IFS= read -r entry; do
            case "${entry##*::}" in
              unchanged_*': test') scenarios+=("${entry%: test}") ;;
            esac
          done <<< "$listing"
          if (( ${#scenarios[@]} == 0 )); then
            echo 'No unchanged black-box scenarios found' >&2
            exit 1
          fi
          DOTS_TEST_TOOL_PATH="$PATH" mise run test -- --no-fail-fast --test '*' -- --include-ignored --exact "${scenarios[@]}"

  rust-distros:
    name: Rust scenarios (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Fedora
            image: fedora:latest
          - distro: Arch
            image: archlinux:base
          - distro: Alpine
            image: alpine:3.23
    env:
      DISTRO: ${{ matrix.distro }}
      IMAGE: ${{ matrix.image }}
      MISE_VERSION: v2026.11.9
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run Rust scenarios in the distribution
        run: |
          # Keep Actions' checkout runtime on Ubuntu, including for musl Alpine.
          docker run --rm -i --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace" \
            --workdir /workspace -e DISTRO -e RUST_VERSION -e MISE_VERSION \
            -e MISE_TRUSTED_CONFIG_PATHS=/workspace "$IMAGE" sh -eu <<'SH'
          rust_host=x86_64-unknown-linux-gnu
          case "$DISTRO" in
            Fedora) dnf install -y bash zsh fish /usr/bin/curl ca-certificates gcc glibc-devel git tar gzip age ;;
            Arch) pacman -Syu --noconfirm --needed bash zsh fish curl ca-certificates gcc git age python ;;
            Alpine)
              apk add --no-cache bash zsh fish curl ca-certificates gcc musl-dev git age python3
              rust_host=x86_64-unknown-linux-musl
              ;;
            *) exit 2 ;;
          esac

          curl -fsSL "https://static.rust-lang.org/rustup/dist/$rust_host/rustup-init" -o /tmp/rustup-init
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --no-modify-path --default-host "$rust_host" \
            --profile minimal --default-toolchain "$RUST_VERSION"
          curl -fsSL "https://github.com/jdx/mise/releases/download/$MISE_VERSION/mise-$MISE_VERSION-linux-x64-musl.tar.gz" \
            -o /tmp/mise.tar.gz
          tar -xzf /tmp/mise.tar.gz -C /tmp mise/bin/mise
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/mise/bin/mise "$HOME/.local/bin/mise"
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          for tool in mise git bash zsh fish; do
            command -v "$tool"
          done
          mise --version
          age --version
          age-keygen --version
          mise run test
          SH

  rust-first-run:
    name: Rust first run (mise and Git)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MISE_VERSION: v2026.11.9
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build the Linux release binary
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends musl-tools
          rustup toolchain install "$RUST_VERSION" --profile minimal --target x86_64-unknown-linux-musl
          seed="$RUNNER_TEMP/dots-first-run"
          mkdir -p "$seed"
          curl -fsSL "https://github.com/jdx/mise/releases/download/$MISE_VERSION/mise-$MISE_VERSION-linux-x64-musl.tar.gz" \
            -o "$RUNNER_TEMP/mise.tar.gz"
          tar -xzf "$RUNNER_TEMP/mise.tar.gz" -C "$RUNNER_TEMP" mise/bin/mise
          install -m 0755 "$RUNNER_TEMP/mise/bin/mise" "$seed/mise"
          "$seed/mise" --version
          CC=musl-gcc CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc \
            "$seed/mise" run build -- --release --target x86_64-unknown-linux-musl
          install -m 0755 target/x86_64-unknown-linux-musl/release/dots "$seed/dots"

      # This check is expected to fail while init or up is still a stub.
      - name: Run dots init and dots up in a fresh container
        run: |
          docker run --rm -i --mount "type=bind,src=$RUNNER_TEMP/dots-first-run,dst=/seed,readonly" \
            alpine:3.23 sh -eu <<'SH'
          apk add --no-cache git ca-certificates
          adduser -D smoke
          su -l smoke <<'SMOKE'
          set -eu
          fixture=$(mktemp -d /tmp/dots-first-run.XXXXXXXX)
          export HOME="$fixture/home" TMPDIR="$fixture/tmp"
          export XDG_CONFIG_HOME="$HOME/.config" XDG_DATA_HOME="$HOME/.local/share"
          export XDG_STATE_HOME="$HOME/.local/state" XDG_CACHE_HOME="$HOME/.cache"
          export CODEX_HOME="$HOME/.codex" CLAUDE_CONFIG_DIR="$HOME/.claude"
          export MISE_CONFIG_DIR="$XDG_CONFIG_HOME/mise" MISE_SYSTEM_CONFIG_DIR="$fixture/mise-system/config"
          export MISE_DATA_DIR="$XDG_DATA_HOME/mise" MISE_CACHE_DIR="$XDG_CACHE_HOME/mise"
          export MISE_STATE_DIR="$XDG_STATE_HOME/mise" MISE_TMP_DIR="$TMPDIR/mise"
          export MISE_INSTALLS_DIR="$MISE_DATA_DIR/installs" MISE_INSTALL_STORE_DIR="$MISE_DATA_DIR/store"
          export MISE_DOWNLOADS_DIR="$MISE_DATA_DIR/downloads" MISE_PLUGINS_DIR="$MISE_DATA_DIR/plugins"
          export MISE_SHIMS_DIR="$MISE_DATA_DIR/shims" MISE_SYSTEM_DATA_DIR="$fixture/mise-system/data"
          export MISE_SYSTEM_INSTALLS_DIR="$MISE_SYSTEM_DATA_DIR/installs"
          export MISE_SYSTEM_PLUGINS_DIRS="$MISE_SYSTEM_DATA_DIR/plugins"
          export MISE_SYSTEM_SHIMS_DIR="$MISE_SYSTEM_DATA_DIR/shims" MISE_CEILING_PATHS="$fixture"
          mkdir -p "$HOME/.local/bin" "$TMPDIR"
          cp /seed/mise /seed/dots "$HOME/.local/bin/"
          export PATH="$HOME/.local/bin:/usr/bin:/bin"
          cd "$HOME"
          dots init </dev/null
          dots up </dev/null
          SMOKE
          SH
