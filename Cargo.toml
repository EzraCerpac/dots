[package]
name = "dots-cli"
version = "0.5.2"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "A dotfiles and machine setup manager for mise"
repository = "https://github.com/EzraCerpac/dots"
publish = ["crates-io"]

[[bin]]
name = "dots"
path = "src/main.rs"

[package.metadata.binstall]
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/dots-{ version }-darwin-amd64.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/dots-{ version }-darwin-arm64.tar.gz"

# The Linux release archives are static musl builds, including for GNU hosts.
[package.metadata.binstall.overrides.'cfg(all(target_os = "linux", target_arch = "x86_64", any(target_env = "gnu", target_env = "musl")))']
pkg-url = "{ repo }/releases/download/v{ version }/dots-{ version }-linux-amd64.tar.gz"

[package.metadata.binstall.overrides.'cfg(all(target_os = "linux", target_arch = "aarch64", any(target_env = "gnu", target_env = "musl")))']
pkg-url = "{ repo }/releases/download/v{ version }/dots-{ version }-linux-arm64.tar.gz"

[dependencies]
bzip2 = "0.6.1"
caseless = "0.2.2"
clap = "4.6.8"
flate2 = "1.1.11"
glob = "0.3.4"
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "xz"] }
nix = { version = "0.32.0", features = ["user"] }
plist = { version = "1.10.4", default-features = false }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
toml_edit = "0.25.19"
unicode-general-category = "1.1.0"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
zip = { version = "9.7.0", default-features = false, features = ["deflate-flate2"] }

[profile.release]
panic = "unwind"
