name: Tests

on:
  workflow_call:
    inputs:
      secrets-only:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.sha, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: ${{ !inputs.secrets-only }}
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: &test-runners ${{ fromJSON(github.base_ref == 'rust' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }}
    env:
      # mise uses the token for GitHub release lookups instead of anonymous rate limits.
      GITHUB_TOKEN: ${{ github.token }}
      MISE_YES: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check shell syntax
        run: |
          status=0
          while IFS= read -r -d '' file; do
            case "$file" in
              *.sh) ;;
              *) head -n1 "$file" | grep -Eq '^#!.*(bash|/sh|env sh)' || continue ;;
            esac
            bash -n "$file" || status=1
          done < <(find bin tasks lib bootstrap init tests packaging -type f -not -path '*/fixtures/*' -print0)
          exit "$status"

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rsync zsh

      - name: Install system packages (macOS)
        if: runner.os == 'macOS'
        run: brew install fish

      - name: Install mise and test tools
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          tools=(node@latest python@3.13 uv@latest age@latest gitleaks@latest jq@latest)
          if [[ "$RUNNER_OS" == Linux ]]; then
            tools+=(github:fish-shell/fish-shell@latest)
          fi
          mise use --global "${tools[@]}"
          # Real install paths, not shims: tests replace HOME and mise config dirs.
          (cd "$RUNNER_TEMP" && mise bin-paths) >> "$GITHUB_PATH"
          # These uv scripts declare PyYAML and tomlkit; their tests import them directly.
          "$(cd "$RUNNER_TEMP" && mise which python3)" -m pip install --quiet pyyaml tomlkit

      - name: Tool versions
        run: |
          mise --version
          for tool in node python3 uv age gitleaks jq fish zsh; do
            printf '%-8s %s\n' "$tool" "$(command -v "$tool" || echo missing)"
          done

      - name: Run tests
        run: tests/run

  go:
    if: ${{ !inputs.secrets-only }}
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: *test-runners
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: dots-up/go.mod
          cache-dependency-path: dots-up/go.sum
      - name: Verify modules and run Go checks
        working-directory: dots-up
        run: |
          go mod verify
          go vet ./...
          go test ./...

  packaging:
    if: ${{ !inputs.secrets-only }}
    name: packaging (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: *test-runners
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: dots-up/go.mod
          cache-dependency-path: dots-up/go.sum

      - name: Build the release archives
        run: packaging/build-release 0.0.0-ci "$RUNNER_TEMP/dist"

      - name: Check the archive layout
        working-directory: ${{ runner.temp }}/dist
        run: |
          (command -v sha256sum >/dev/null && sha256sum -c SHA256SUMS) || shasum -a 256 -c SHA256SUMS
          for platform in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            name="dots-0.0.0-ci-$platform"
            listing="$(tar -tzf "$name.tar.gz")"
            # One top-level directory: Homebrew strips it, mise finds its bin/.
            test "$(printf '%s\n' "$listing" | cut -d/ -f1 | sort -u)" = "$name"
            for file in VERSION bin/dots bin/dots-up completions/_dots completions/dots.bash completions/dots.fish lib/dots-manager.sh tasks/update skills/dots/SKILL.md LICENSE; do
              printf '%s\n' "$listing" | grep -qx "$name/$file" || { echo "$name lacks $file"; exit 1; }
            done
            if printf '%s\n' "$listing" | grep -Eq "^$name/(tests|dots-up|packaging|\.github)/"; then
              echo "$name ships development files"; exit 1
            fi
          done
          ruby -c dots.rb
          if grep -q '"0\{64\}"' dots.rb; then echo 'dots.rb kept a placeholder checksum'; exit 1; fi

      - name: Install from the archive and run it
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) platform=linux-amd64 ;; Linux-ARM64) platform=linux-arm64 ;;
            macOS-X64) platform=darwin-amd64 ;; macOS-ARM64) platform=darwin-arm64 ;;
          esac
          prefix="$RUNNER_TEMP/install"
          mkdir -p "$prefix" "$RUNNER_TEMP/home/.claude"
          tar -xzf "$RUNNER_TEMP/dist/dots-0.0.0-ci-$platform.tar.gz" -C "$prefix"
          dots="$prefix/dots-0.0.0-ci-$platform/bin/dots"
          export HOME="$RUNNER_TEMP/home"
          "$dots" completions bash | cmp - "${dots%/bin/dots}/completions/dots.bash"
          printf "[tools]\nexample = '1'\n" > "$RUNNER_TEMP/selected.toml"
          "$dots" internal shell-complete remove --path "$RUNNER_TEMP/selected.toml" ex | cut -f1 | grep -qx example
          test ! -e "$HOME/.claude/skills/dots"
          test "$("$dots" --version)" = "dots 0.0.0-ci (archive)"
          "$dots" --help | grep -q 'Your machine setup'
          "$("$dots" internal home)/bin/dots-up" --capabilities | grep -qx 'dots-shared-cli/3'
          test -f "$HOME/.claude/skills/dots/SKILL.md"

      - name: Keep the archives for review
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archives
          path: ${{ runner.temp }}/dist
          retention-days: 7

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      MISE_YES: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Scan every commit: a secret removed later is still public.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL https://mise.run | sh
          "$HOME/.local/bin/mise" use --global gitleaks@latest
          (cd "$RUNNER_TEMP" && "$HOME/.local/bin/mise" bin-paths) >> "$GITHUB_PATH"

      - name: Scan history
        # Include merge diffs, which `git log` omits by default.
        run: gitleaks git --no-banner --redact --verbose --log-opts='--all --full-history --diff-merges=first-parent' .
