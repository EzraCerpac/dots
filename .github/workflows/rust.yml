name: CI

on:
  pull_request:
  push:
    branches: [rust, main, ci/overhaul]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
      rust: ${{ steps.classify.outputs.rust }}
      legacy: ${{ steps.classify.outputs.legacy }}
      other: ${{ steps.classify.outputs.other }}
      non_docs: ${{ steps.classify.outputs.non_docs }}
      full: ${{ steps.classify.outputs.full }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/classify-changes

  lint:
    name: Rust lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          target: x86_64-unknown-linux-gnu
          components: rustfmt,clippy
      - run: .mise/rust-cargo fmt --all -- --check
      - run: .mise/rust-cargo clippy --locked --all-targets -- -D warnings

  linux:
    name: Linux x86_64
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/rust-target.yml
    with:
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-musl
      suites: >-
        ${{ needs.changes.outputs.full == 'true'
            && '["native","Fedora","Arch","Alpine","oracle"]'
            || '["native","Fedora","Arch","Alpine"]' }}
      first-run: ${{ needs.changes.outputs.full == 'true' }}

  extended:
    name: ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            suites: '["native"]'
          - runner: macos-26
            target: aarch64-apple-darwin
            suites: '["1/2","2/2","oracle"]'
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            suites: '["1/2","2/2"]'
    uses: ./.github/workflows/rust-target.yml
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      suites: ${{ matrix.suites }}

  legacy-and-secrets:
    name: Legacy and secrets
    needs: changes
    if: needs.changes.outputs.non_docs == 'true'
    uses: ./.github/workflows/test.yml
    with:
      secrets-only: ${{ needs.changes.outputs.legacy != 'true' }}

  ci:
    name: ci
    if: always()
    needs: [changes, lint, linux, extended, legacy-and-secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      DOCS: ${{ needs.changes.outputs.docs }}
      RUST: ${{ needs.changes.outputs.rust }}
      LEGACY: ${{ needs.changes.outputs.legacy }}
      OTHER: ${{ needs.changes.outputs.other }}
      NON_DOCS: ${{ needs.changes.outputs.non_docs }}
      FULL: ${{ needs.changes.outputs.full }}
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Summarize and check results
        run: |
          {
            echo '### CI'
            printf 'Paths detected: docs=%s, Rust=%s, legacy=%s, other=%s.\n\n' "$DOCS" "$RUST" "$LEGACY" "$OTHER"
            echo '| Job group | Result | Selection |'
            echo '| --- | --- | --- |'
            printf '| Classification | %s | Every run |\n' "$(jq -r '.changes.result' <<< "$RESULTS")"
            printf '| Rust lint and Linux x86_64 | %s / %s | Rust changes (%s) |\n' \
              "$(jq -r '.lint.result' <<< "$RESULTS")" "$(jq -r '.linux.result' <<< "$RESULTS")" "$RUST"
            printf '| Linux ARM and macOS | %s | Rust changes (%s) on full-matrix events (%s) |\n' \
              "$(jq -r '.extended.result' <<< "$RESULTS")" "$RUST" "$FULL"
            printf '| Legacy and secrets | %s | Legacy suites for legacy changes (%s). Secret scan for non-docs changes (%s). |\n' \
              "$(jq -r '."legacy-and-secrets".result' <<< "$RESULTS")" "$LEGACY" "$NON_DOCS"
            printf '\nFirst-run smoke and both v0.4.0 oracles are selected on full-matrix Rust runs.\n'
          } >> "$GITHUB_STEP_SUMMARY"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS"
