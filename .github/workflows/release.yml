name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/rust.yml
    permissions:
      actions: read
      contents: read

  release:
    needs: test
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.test.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archives
          path: dist

      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          TESTED_COMMIT: ${{ needs.test.outputs.tested-commit }}
        working-directory: dist
        shell: bash
        run: |
          version=${TAG#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]
          assets=()
          for platform in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            archive="dots-$version-$platform.tar.gz"
            [[ -f "$archive" ]]
            assets+=("$archive")
          done
          shasum -a 256 -c SHA256SUMS
          grep -Fx "  version \"$version\"" dots.rb

          if [[ ! "$TESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "CI did not report the tested commit" >&2
            exit 1
          fi
          ref="refs/tags/$TAG"
          if ! remote_commit=$(git ls-remote --exit-code --tags "$GITHUB_SERVER_URL/$GH_REPO.git" "$ref" "$ref^{}" |
            awk -v ref="$ref" '
              $2 == ref { tag = $1; tags++ }
              $2 == ref "^{}" { peeled = $1; peels++ }
              END { if (tags != 1 || peels > 1) exit 1; print (peels ? peeled : tag) }
            '); then
            echo "Could not resolve remote tag $TAG" >&2
            exit 1
          fi
          if [[ "$remote_commit" != "$TESTED_COMMIT" ]]; then
            echo "Remote tag $TAG points to $remote_commit, but CI tested $TESTED_COMMIT" >&2
            exit 1
          fi
          gh release create "$TAG" "${assets[@]}" SHA256SUMS dots.rb --verify-tag --title "$TAG" --generate-notes
