name: Rust target

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      suites:
        required: true
        type: string
      first-run:
        type: boolean
        default: false

permissions:
  contents: read

env:
  MISE_VERSION: v2026.11.9
  TARGET: ${{ inputs.target }}

jobs:
  build:
    name: Build test archive
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          target: ${{ inputs.target }}
      - uses: ./.github/actions/scenario-tools

      - name: Build and compress tests
        run: |
          bundle="$RUNNER_TEMP/dots-build"
          mkdir -p "$bundle"
          printf '%s\n' "$(pwd -P)" > "$bundle/workspace"
          cargo nextest archive --locked --target "$TARGET" \
            --archive-file "$bundle/tests.tar.zst" --zstd-level 1
          tar -czf "$bundle/tools.tar.gz" -C "$RUNNER_TEMP/dots-scenario-tools" .
      - name: Upload the test archive and tools
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ inputs.target }}
          path: ${{ runner.temp }}/dots-build
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
          overwrite: true

  test:
    name: Tests (${{ matrix.suite }})
    needs: build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suites) }}
    env:
      SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-${{ inputs.target }}
          path: ${{ runner.temp }}/dots-build

      - name: Prepare the released v0.4.0 oracle
        if: matrix.suite == 'oracle'
        env:
          PLATFORM: ${{ runner.os == 'macOS' && 'darwin-arm64' || 'linux-amd64' }}
        run: bash .github/scripts/setup-oracle
      - name: Run distribution scenarios from the musl archive
        if: contains(fromJSON('["Fedora","Arch","Alpine"]'), matrix.suite)
        run: bash .github/scripts/run-distro
      - name: Run nextest from the archive
        if: ${{ !contains(fromJSON('["Fedora","Arch","Alpine"]'), matrix.suite) }}
        run: |
          bash .github/scripts/setup-runner-tools
          bash .github/scripts/run-nextest
      - name: Summarize timings and flakes
        if: always()
        run: python3 .github/scripts/summarize-nextest.py target/nextest/ci/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ inputs.target }}-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  first-run:
    name: First run (mise and Git)
    needs: build
    if: inputs.first-run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-${{ inputs.target }}
          path: ${{ runner.temp }}/dots-build
      - name: Run dots init and dots up in a fresh container
        run: |
          tar -xzf "$RUNNER_TEMP/dots-build/tools.tar.gz" -C "$RUNNER_TEMP" ./bin/mise
          export PATH="$RUNNER_TEMP/bin:$PATH"
          bash .github/scripts/run-first-run "$RUNNER_TEMP/dots-build/tests.tar.zst"
